name: CI

on:
  push:
    branches: [main]
  pull_request:

# Privilegi minimi: il workflow legge soltanto il codice.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      # Actions fissate al commit (non al tag), per non eseguire codice modificato a posteriori.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installa le dipendenze dal lockfile (script di installazione disattivati da .npmrc)
        run: npm ci

      - name: Verifica firme e attestazioni dei pacchetti
        run: npm audit signatures

      - name: Controlla le vulnerabilità note
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Test del server
        run: npm test

      - name: Build del client
        run: npm run build
